<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="IMP — moda independente, luxo e streetwear.">
  <title>IMP — Loja Oficial</title>
  <style>
    :root{--preto:#ffffff;--branco:#080808;--cinza:#666666;--linha:#e5e5e5}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--preto);color:var(--branco);font-family:Impact,'Arial Black',Arial,Helvetica,sans-serif;letter-spacing:-.025em}
    a{color:inherit;text-decoration:none; -webkit-tap-highlight-color:transparent}
    .marca{display:inline-block;transition:transform .25s ease,text-shadow .25s ease}
    .marca:hover{transform:translateY(-2px);text-shadow:0 3px 0 #d8d8d8,0 7px 14px #00000020}
    .marca:active{transform:translateY(1px) scale(.97)}
    .cabecalho{height:76px;display:flex;align-items:center;justify-content:center;padding:0 24px;background:#fff;border-bottom:1px solid var(--linha);position:relative;z-index:5;margin-bottom:0}
    .marca{font-family:Impact,'Arial Black',Arial,sans-serif;font-size:36px;line-height:1;font-weight:900;letter-spacing:-2px;text-shadow:0 1px 0 #ffffff}
    .copyright{font-family:Arial,sans-serif;font-size:.34em;vertical-align:top;letter-spacing:0;margin-left:3px}
    .capa{min-height:790px;height:100svh;max-height:1050px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff}
    .capa-galeria{position:absolute;inset:0;overflow:hidden;background:#fff}
    .capa-imagem{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;opacity:0;filter:saturate(.96) contrast(1.06);transform:scale(1);transition:opacity 1.5s ease}
    .capa-imagem.ativa{opacity:1;animation:none}
    .capa-galeria:before{content:"";position:absolute;inset:-35%;z-index:1;pointer-events:none;background:linear-gradient(110deg,transparent 40%,#ffffff38 49%,#ffffff08 53%,transparent 62%);transform:translateX(-65%);animation:passagem-luz 8s ease-in-out infinite}
    .capa-galeria:after{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(90deg,#00000018,transparent 24%,transparent 76%,#00000018),linear-gradient(0deg,#00000020,transparent 32%,transparent 72%,#00000012);pointer-events:none}
    .capa:before,.capa:after{content:"";position:absolute;border:1px solid #00000012;border-radius:50%;width:min(78vw,850px);aspect-ratio:1}
    .capa:after{width:min(58vw,620px)}
    .capa-conteudo{position:relative;z-index:1;text-align:center;padding:100px 20px 70px}
    .capa h1{font-family:Impact,'Arial Black',Arial,sans-serif;font-size:clamp(130px,30vw,390px);line-height:.72;letter-spacing:-.075em;margin:0;font-weight:900;text-shadow:0 5px 28px #00000012}
    .capa p{font-size:10px;letter-spacing:.38em;text-transform:uppercase;color:#555555;margin:38px 0 0}
    .indicador{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:.25em;color:#777;text-transform:uppercase;white-space:nowrap}
    .secao{padding:110px max(6vw,24px);position:relative;isolation:isolate}
    .secao:before{content:"";position:absolute;left:0;right:0;top:-42px;height:42px;background:linear-gradient(to bottom,transparent 0%,rgba(255,255,255,.16) 55%,#ffffff 100%);pointer-events:none;z-index:-1}
    .cabecalho-secao{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:34px}
    .sobretitulo{font-size:9px;letter-spacing:.28em;color:var(--cinza);text-transform:uppercase}
    h2{font-family:Impact,'Arial Black',Arial,sans-serif;font-size:clamp(38px,6vw,72px);font-weight:900;letter-spacing:-.045em;margin:12px 0 0;text-transform:uppercase}
    .texto-apoio{font-size:12px;color:var(--cinza);line-height:1.7;max-width:360px}
    .colecoes{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;width:100%;max-width:1120px;margin:0 auto}
    .colecao{min-height:0;aspect-ratio:16/7;position:relative;overflow:hidden;background:#171717;display:flex;align-items:end;padding:clamp(28px,5vw,64px);border:1px solid #dedede;box-shadow:0 16px 34px #00000022,0 4px 9px #00000018,inset 0 1px 0 #ffffff35}
    .colecao-imagem{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;transition:transform .65s ease,filter .65s;filter:contrast(1.04) saturate(.96)}\n    .colecao:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#000000a8 0%,#00000038 36%,transparent 72%),linear-gradient(135deg,#ffffff20,transparent 42%,#00000022);pointer-events:none}\n    .colecao:nth-child(2){background:linear-gradient(155deg,#eeeeee,#e2e2e2 55%,#d5d5d5)}
    .colecao:nth-child(3){background:linear-gradient(135deg,#e5e5e5,#f4f4f4 48%,#dcdcdc)}
    .colecao:before{content:"";position:absolute;width:70%;height:115%;left:15%;top:8%;border:1px solid #00000018;transform:rotate(18deg);border-radius:48% 48% 8% 8%;transition:transform .7s}
    .colecao:hover:before{transform:rotate(10deg) scale(1.08)}\n    .colecao:hover .colecao-imagem{transform:scale(1.035);filter:contrast(1.08) saturate(1.02)}
    .colecao span{position:relative;z-index:1;color:#fff;text-shadow:0 2px 5px #00000070,0 8px 18px #00000055;font-family:Impact,'Arial Black',Arial,sans-serif;font-size:clamp(44px,7vw,88px);font-weight:900;letter-spacing:-.035em;text-transform:uppercase}
    .colecao span strong{display:block;max-width:900px;font-size:clamp(38px,6.4vw,78px);font-weight:900;line-height:.88;letter-spacing:-.045em;color:#fff;text-wrap:balance;text-shadow:0 2px 0 #ffffff35,0 5px 10px #00000085,0 14px 28px #00000070}\n    .colecao span strong .nome-gengar{color:#a855f7;-webkit-text-stroke:0;text-shadow:0 2px 0 #6b21a8,0 8px 14px #000000b0,0 16px 28px #00000085}
    .colecao span small{display:inline-block;font-family:Arial,Helvetica,sans-serif;font-size:10px;font-weight:700;letter-spacing:.32em;color:#fff;margin-bottom:16px;padding:8px 11px;border:1px solid #ffffff85;background:#00000035;backdrop-filter:blur(8px);text-shadow:0 1px 4px #00000070}
    .colecao small{display:block;font-size:11px;letter-spacing:.24em;color:#666666;margin-bottom:14px;text-transform:uppercase}
    .manifesto{border-top:1px solid var(--linha);border-bottom:1px solid var(--linha);text-align:center;padding:120px 24px}
    .manifesto p{font-family:Impact,'Arial Black',Arial,sans-serif;font-size:clamp(38px,7vw,86px);font-weight:900;line-height:.98;letter-spacing:-.04em;text-transform:uppercase;max-width:1000px;margin:20px auto}
    .rodape{min-height:150px;padding:42px 24px;display:flex;align-items:center;justify-content:center}
    .rodape strong{font-family:Impact,'Arial Black',Arial,sans-serif;font-size:17px;letter-spacing:.24em;font-weight:900}

    /* Movimento cinematográfico */
    body:after{content:"";position:fixed;inset:0;z-index:20;pointer-events:none;opacity:.12;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.16'/%3E%3C/svg%3E");mix-blend-mode:multiply}
    .cabecalho{animation:entrada .9s .15s both}
    .capa{isolation:isolate}
    .capa:after{animation:orbita 24s ease-in-out infinite alternate}
    .capa:before{animation:orbita 32s ease-in-out infinite alternate-reverse}
    .capa-conteudo h1{animation:titulo 1.35s cubic-bezier(.2,.75,.2,1) both}
    .capa-conteudo p{animation:entrada 1s .55s both}
    .indicador{animation:entrada 1s 1s both;transition:letter-spacing .4s}
    .indicador:hover{letter-spacing:.4em}
    .capa:after{box-shadow:0 0 90px #00000008}
    .secao,.manifesto{opacity:0;transform:translateY(42px);transition:opacity 1s ease,transform 1s cubic-bezier(.2,.7,.2,1)}
    .secao.visivel,.manifesto.visivel{opacity:1;transform:translateY(0)}
    .colecao{transform:perspective(1100px) rotateX(0deg) rotateY(0deg);transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.7,.2,1),filter .55s,box-shadow .55s;will-change:transform}
    .colecao:hover{transform:perspective(1100px) translateY(-10px) rotateX(2deg) rotateY(-1deg) scale(1.012);filter:contrast(1.06);box-shadow:0 34px 0 -22px #bdbdbd,0 38px 85px #00000024}
    .colecao:active{transform:perspective(1100px) translateY(-2px) scale(.985);box-shadow:0 8px 18px #00000018}
    .colecao:focus-visible,.marca:focus-visible{outline:2px solid #111;outline-offset:6px}
    .manifesto p{transition:letter-spacing .8s}
    .manifesto.visivel p{letter-spacing:.005em}
    @keyframes entrada{from{opacity:0}to{opacity:1}}
    @keyframes titulo{from{opacity:0;transform:translateY(55px) scale(.94);filter:blur(12px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
    @keyframes orbita{from{transform:scale(.94) rotate(-8deg)}to{transform:scale(1.06) rotate(8deg)}}\n    @keyframes zoom-banner{from{transform:scale(1.07)}to{transform:scale(1.17)}}\n    @keyframes passagem-luz{0%,18%{transform:translateX(-65%)}65%,100%{transform:translateX(65%)}}
    @media(max-width:700px){.secao,.manifesto{transform:translateY(24px)}}
    @media(prefers-reduced-motion:reduce){.cabecalho,.capa-conteudo h1,.capa-conteudo p,.indicador,.capa:before,.capa:after,.capa-imagem.ativa,.capa-galeria:before{animation:none!important}.capa-imagem{transform:none}.secao,.manifesto{opacity:1;transform:none;transition:none}}
    @media(max-width:700px){.cabecalho{height:66px}.marca{font-size:27px}.capa{min-height:680px}.capa:before{width:110vw}.capa:after{width:82vw}.capa p{font-size:8px;letter-spacing:.25em}.secao{padding:78px 18px}.cabecalho-secao{display:block}.texto-apoio{margin-top:18px}.colecoes{grid-template-columns:1fr}.colecao{min-height:0;aspect-ratio:16/10;padding:24px}.colecao:last-child{grid-column:auto;min-height:0;aspect-ratio:16/10}.colecao span{font-size:clamp(36px,10vw,54px)}.colecao span strong{font-size:clamp(34px,9vw,54px);line-height:.9}.colecao span small{font-size:8px;margin-bottom:13px}.colecao small{font-size:9px;margin-bottom:10px}.manifesto{padding:90px 22px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{transition:none!important}}
  </style>
</head>
<body>
  <header class="cabecalho"><a class="marca" href="#" aria-label="IMP — início">IMP<sup class="copyright">©</sup></a></header>
  <main>
    <section class="capa" aria-label="Apresentação da IMP">
      <div class="capa-galeria" aria-label="Imagens da coleção">
        <img class="capa-imagem ativa" src="assets/454DCD45-72A7-4CBD-9416-D13027725291.png" alt="Imagem da coleção IMP" fetchpriority="high">
        <img class="capa-imagem" src="assets/B6900736-E412-48FF-8C1A-DDAC45E2BE3B.png" alt="Imagem da coleção IMP" loading="lazy">
        <img class="capa-imagem" src="assets/C3D9D17F-9A2A-4B9A-A850-972EDC15F44F.png" alt="Imagem da coleção IMP" loading="lazy">
      </div>
    </section>
    <section class="secao" id="colecao">
      <div class="colecoes">
        <a class="colecao" href="camiseta-gengar.html" aria-label="Ver detalhes da CAMISETA IMP GENGAR DROP #1"><img class="colecao-imagem" src="assets/13D9B87E-C8EC-486B-ABA7-8F806122024E.jpeg" alt="CAMISETA IMP GENGAR DROP #1" loading="lazy"><span><strong>CAMISETA IMP <span class="nome-gengar">GENGAR</span> DROP #1</strong></span></a>
      </div>
    </section>
    <section class="manifesto" id="novidades">
      <div class="sobretitulo">A identidade é sua</div>
      <p>Menos excesso.<br>Mais presença.</p>
    </section>
  </main>
  <footer class="rodape"><strong>IMP COMPANY<sup class="copyright">©</sup></strong></footer>
  <script>
    (() => {
      const imagensCapa = document.querySelectorAll('.capa-imagem');
      if (imagensCapa.length > 1 && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        let imagemAtual = 0;
        window.setInterval(() => {
          imagensCapa[imagemAtual].classList.remove('ativa');
          imagemAtual = (imagemAtual + 1) % imagensCapa.length;
          imagensCapa[imagemAtual].classList.add('ativa');
        }, 5000);
      }
      const elementos = document.querySelectorAll('.secao, .manifesto');
      if (!('IntersectionObserver' in window) || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        elementos.forEach(el => el.classList.add('visivel'));
        return;
      }
      const observador = new IntersectionObserver((entradas, observer) => {
        entradas.forEach(entrada => {
          if (entrada.isIntersecting) {
            entrada.target.classList.add('visivel');
            observer.unobserve(entrada.target);
          }
        });
      }, { threshold: 0.14 });
      elementos.forEach(el => observador.observe(el));
    })();
  </script>
</body>
</html>
